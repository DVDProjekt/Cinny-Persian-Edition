    <script>
      window.global ||= window;

      (function() {
    
        const messageSelector = "._1xny9xl0._1mqalmd1._1mqalmd0._1xny9xla._1xny9xlp._161nxvew._161nxvex";

        
        function fixDirection(element) {
            
            if (element.hasAttribute('data-dir-fixed')) return;

            const text = element.innerText || element.textContent;
            if (!text) return;

            
            const isRTL = /^[\u0600-\u06FF]/.test(text.trim());

            if (isRTL) {
                element.style.direction = 'rtl';
                element.style.textAlign = 'left';
            } else {
                element.style.direction = 'ltr';
                element.style.textAlign = 'left';
            }
            
        
            element.setAttribute('data-dir-fixed', 'true');
        }


        function processAllMessages() {
            document.querySelectorAll(messageSelector).forEach(fixDirection);
        }


        processAllMessages();


        const observer = new MutationObserver((mutations) => {
            for (const mutation of mutations) {
                for (const node of mutation.addedNodes) {
                    if (node.nodeType === 1) { 

                        if (node.matches && node.matches(messageSelector)) {
                            fixDirection(node);
                        }
                      
                        const children = node.querySelectorAll(messageSelector);
                        children.forEach(fixDirection);
                    }
                }
            }
        });


        observer.observe(document.body, { childList: true, subtree: true });


        setInterval(processAllMessages, 2000);

    })();




    </script>
